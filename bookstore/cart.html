<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - BentoBooks</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="table.css" />
  </head>

  <body>
    <header>
      <h1>BentoBooks</h1>
      <p>Your Gateway to Infinite Stories</p>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about-books.html">Categories</a></li>
        <li><a href="registration-form.html">Login</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <main>
      <section class="cart-section">
        <h2>Your Shopping Cart</h2>

        <div id="book-details" class="info-card" style="border-left-color: #27ae60;"></div>

        <div id="price-calculator" class="info-card" style="border-left-color: #f39c12; margin-top: 15px;"></div>

        <div id="discount-result" class="info-card" style="border-left-color: #e74c3c; margin-top: 15px;"></div>

        <div id="category-display" class="info-card" style="border-left-color: #9b59b6; margin-top: 15px;"></div>

        <div id="book-list" class="info-card" style="border-left-color: #4a90a4; margin-top: 15px;"></div>

        <div id="search-result" class="info-card" style="border-left-color: #3498db; margin-top: 15px;"></div>

        <p id="cart-count" class="cart-count" style="margin-top: 20px;">Items in cart: 0</p>

        <div class="cart-items-container">
          <div id="cart-items">
          </div>
          <p class="cart-empty-message">Your cart is empty. Browse our <a href="about-books.html">book collection</a> to add items!</p>
        </div>

        <div class="cart-summary">
          <p id="cart-total" class="cart-total">Total: ₹0</p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 BentoBooks. All rights reserved.</p>
    </footer>

    <script src="cart.js"></script>
  </body>
</html>
