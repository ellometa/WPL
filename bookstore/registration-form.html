<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Registration - BentoBooks</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="form.css" />
  </head>

  <body>
    <header>
      <h1>BentoBooks</h1>
      <p>Your Gateway to Infinite Stories</p>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="#categories">Categories</a></li>
        <li><a href="#login">Login</a></li>
        <li><a href="#cart">Cart</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <main>
      <section>
        <h2>New User Registration</h2>
        <p class="required-note">Fields marked with <span style="color: red;">*</span> are required.</p>

        <form action="#" method="post" enctype="multipart/form-data">
          <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name <span style="color: red;">*</span></label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              placeholder="Enter your full name"
              required
              autofocus
              pattern="[A-Za-z\s]{2,50}"
              title="Name should contain only letters and spaces (2-50 characters)"
            />

            <label for="email">Email Address <span style="color: red;">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@email.com"
              required
            />

            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="(123) 456-7890"
              pattern="[\d\s\-\(\)]{10,15}"
              title="Enter a valid phone number"
            />

            <label for="dob">Date of Birth <span style="color: red;">*</span></label>
            <input type="date" id="dob" name="dob" required />
          </fieldset>

          <fieldset>
            <legend>Account Information</legend>

            <label for="username">Username <span style="color: red;">*</span></label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Choose a username"
              required
              pattern="[A-Za-z0-9_]{4,20}"
              title="Username must be 4-20 characters (letters, numbers, underscore)"
            />

            <label for="password">Password <span style="color: red;">*</span></label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a strong password"
              required
              pattern=".{8,}"
              title="Password must be at least 8 characters"
            />

            <label for="confirmpassword">Confirm Password <span style="color: red;">*</span></label>
            <input
              type="password"
              id="confirmpassword"
              name="confirmpassword"
              placeholder="Re-enter your password"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Preferences</legend>

            <label>Gender</label>
            <div class="radio-group">
              <input type="radio" id="male" name="gender" value="male" />
              <label for="male">Male</label>

              <input type="radio" id="female" name="gender" value="female" />
              <label for="female">Female</label>

              <input type="radio" id="other" name="gender" value="other" />
              <label for="other">Other</label>

              <input type="radio" id="prefer-not" name="gender" value="prefer-not" />
              <label for="prefer-not">Prefer not to say</label>
            </div>

            <label>Favorite Genres</label>
            <div class="checkbox-group">
              <input type="checkbox" id="fiction" name="genres" value="fiction" />
              <label for="fiction">Fiction</label>

              <input type="checkbox" id="mystery" name="genres" value="mystery" />
              <label for="mystery">Mystery</label>

              <input type="checkbox" id="romance" name="genres" value="romance" />
              <label for="romance">Romance</label>

              <input type="checkbox" id="scifi" name="genres" value="scifi" />
              <label for="scifi">Sci-Fi</label>

              <input type="checkbox" id="biography" name="genres" value="biography" />
              <label for="biography">Biography</label>
            </div>

            <label for="profilepic">Profile Picture</label>
            <input
              type="file"
              id="profilepic"
              name="profilepic"
              accept="image/*"
            />
          </fieldset>
          <fieldset>
            <legend>Terms & Conditions</legend>

            <div class="checkbox-group">
              <input type="checkbox" id="terms" name="terms" required />
              <label for="terms">I agree to the <a href="#">Terms and Conditions</a> <span style="color: red;">*</span></label>
            </div>

            <div class="checkbox-group">
              <input type="checkbox" id="newsletter" name="newsletter" />
              <label for="newsletter">Subscribe to our newsletter for book recommendations</label>
            </div>
          </fieldset>

          <div style="text-align: center; margin-top: 20px;">
            <input type="submit" value="Create Account" />
            <input type="reset" value="Clear Form" />
          </div>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 BentoBooks. All rights reserved.</p>
    </footer>
  </body>
</html>
